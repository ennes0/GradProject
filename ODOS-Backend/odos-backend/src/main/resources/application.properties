spring.application.name=odos-backend

# PostgreSQL (odos_routing + PostGIS)
spring.datasource.url=jdbc:postgresql://localhost:5432/odos_routing2
spring.datasource.username=postgres
spring.datasource.password=${ODOS_DB_PASSWORD:enes123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: sadece graf yükleme için kullanıyoruz; DDL/validation kapalı
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
odos.jwt.secret=${ODOS_JWT_SECRET:D9uinr79b/oFqTlSx80CiiIETPCAYh/w15Vy1AhtTmK/U1G/vQF3kioole+T5gK8N0aKyPQ/i7dJrcaQmJBLrQ==}
odos.jwt.access-token-minutes=${ODOS_JWT_ACCESS_MINUTES:30}
odos.jwt.refresh-token-days=${ODOS_JWT_REFRESH_DAYS:14}

# CORS
odos.cors.allowed-origins=${ODOS_CORS_ALLOWED_ORIGINS:*}

# Graf: kenar geometrisi (WKT) bellekte büyük; segment poliline ihtiyaç varsa true yapın.
odos.graph.load-edge-geometry=false
# Snap (en yakın düğüm) için grid çözünürlüğü (8–256).
odos.graph.spatial-grid=64

# Kullanıcı profil / banner görselleri (disk). Repoya eklenmesin — .gitignore
odos.user-media.root=${ODOS_USER_MEDIA_ROOT:./data/user-media}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
