spring.application.name=odos-backend
server.port=${PORT:8080}

# PostgreSQL (odos_routing + PostGIS)
spring.datasource.url=${ODOS_DB_URL:jdbc:postgresql://dpg-d7ub93j7uimc739jl6hg-a.frankfurt-postgres.render.com:5432/odosdb}
spring.datasource.username=${ODOS_DB_USERNAME:odosdb_user}
spring.datasource.password=${ODOS_DB_PASSWORD:cvbVIotcB5Vtfg4Fw2AivXwrevfu8Hjn}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: sadece graf yükleme için kullanıyoruz; DDL/validation kapalı
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.data-source-properties.ssl=${ODOS_DB_SSL:true}
spring.datasource.hikari.data-source-properties.sslmode=${ODOS_DB_SSLMODE:require}
# JWT
odos.jwt.secret=${ODOS_JWT_SECRET:D9uinr79b/oFqTlSx80CiiIETPCAYh/w15Vy1AhtTmK/U1G/vQF3kioole+T5gK8N0aKyPQ/i7dJrcaQmJBLrQ==}
odos.jwt.access-token-minutes=${ODOS_JWT_ACCESS_MINUTES:30}
odos.jwt.refresh-token-days=${ODOS_JWT_REFRESH_DAYS:14}

# CORS
odos.cors.allowed-origins=${ODOS_CORS_ALLOWED_ORIGINS:*}

# Graf: kenar geometrisi (WKT) bellekte büyük; segment poliline ihtiyaç varsa true yapın.
odos.graph.load-edge-geometry=false
# Snap (en yakın düğüm) için grid çözünürlüğü (8–256).
odos.graph.spatial-grid=64

# Kullanıcı profil / banner görselleri (disk). Repoya eklenmesin — .gitignore
odos.user-media.root=${ODOS_USER_MEDIA_ROOT:./data/user-media}
odos.user-media.s3-enabled=${ODOS_USER_MEDIA_S3_ENABLED:true}
odos.user-media.s3-bucket=${ODOS_USER_MEDIA_S3_BUCKET:odos-project-images}
odos.user-media.s3-region=${ODOS_USER_MEDIA_S3_REGION:eu-north-1}
odos.user-media.s3-prefix=${ODOS_USER_MEDIA_S3_PREFIX:users}
odos.user-media.s3-public-base-url=${ODOS_USER_MEDIA_S3_PUBLIC_BASE_URL:https://odos-project-images.s3.eu-north-1.amazonaws.com}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
